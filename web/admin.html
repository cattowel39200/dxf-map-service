<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>사용 현황 · 지적도 DXF 추출</title>
<link rel="stylesheet" href="style.css">
<style>
body{overflow:auto}
.wrap{max-width:1120px;margin:0 auto;padding:28px 22px 60px}
.head{display:flex;align-items:baseline;gap:14px;margin-bottom:22px;flex-wrap:wrap}
.head h1{font-size:20px;margin:0;letter-spacing:-.02em}
.head .sub{font-size:12px;color:var(--text-3)}
.head .right{margin-left:auto;display:flex;gap:8px;align-items:center}

.gate{max-width:340px;margin:14vh auto;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:24px;box-shadow:var(--shadow-lg)}
.gate h2{margin:0 0 6px;font-size:16px}
.gate p{margin:0 0 16px;font-size:12px;color:var(--text-3);line-height:1.5}
.gate input{width:100%;border:1px solid var(--line);background:var(--sunken);border-radius:7px;
  padding:10px 12px;font:inherit;color:var(--text);outline:none;margin-bottom:10px}
.gate input:focus{border-color:var(--accent);background:var(--panel)}
.gate .err{color:var(--danger);font-size:11.5px;margin-top:8px;display:none}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:22px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.card .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--text-3)}
.card .v{font-size:23px;font-weight:650;margin-top:5px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.card .n{font-size:11px;color:var(--text-3);margin-top:2px}
.card.warn .v{color:var(--danger)}

.panelbox{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:18px;overflow:hidden}
.panelbox > h2{font-size:12.5px;margin:0;padding:12px 16px;border-bottom:1px solid var(--line-soft);
  font-weight:650;display:flex;align-items:center;gap:8px}
.panelbox > h2 .cnt{font-family:var(--mono);font-size:10px;color:var(--text-3);font-weight:400}
.pad{padding:14px 16px}

.chart{display:flex;align-items:flex-end;gap:2px;height:120px}
.chart .bar{flex:1;min-width:3px;background:var(--accent);border-radius:2px 2px 0 0;
  position:relative;opacity:.85;min-height:1px}
.chart .bar.zero{background:var(--line);opacity:.5}
.chart .bar .e{position:absolute;left:0;right:0;bottom:0;background:var(--danger);border-radius:2px 2px 0 0}
.chart .bar:hover{opacity:1}
.chart .bar .tip{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);
  background:var(--text);color:var(--panel);font-size:10.5px;padding:3px 7px;border-radius:5px;
  white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .1s;font-family:var(--mono);z-index:5}
.chart .bar:hover .tip{opacity:1}
.axis{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--text-3);margin-top:6px}

/* 판매 설정 */
.setrow{display:flex;flex-direction:column;gap:5px;margin-bottom:11px;max-width:420px}
.setrow label{font-size:11px;color:var(--text-3)}
.setrow input{border:1px solid var(--line);background:var(--sunken);border-radius:7px;
  padding:9px 12px;font:inherit;font-size:13px;color:var(--text);outline:none}
.setrow input:focus{border-color:var(--accent);background:var(--panel)}
.setrow:has(#setSave){flex-direction:row;gap:10px}
.setmsg{font-size:12px;color:var(--ok)}
.setmsg.err{color:var(--danger)}
.sethelp{font-size:11px;color:var(--text-3);margin:2px 0 0;line-height:1.6}

/* 신청자 관리 */
.appmail{font-weight:600;font-size:12px}
.appwho{font-size:11px;color:var(--text-3);margin-top:1px}
.lickey{font-family:var(--mono);font-size:11px;font-weight:600}
.licmeta{font-size:10px;color:var(--text-3);margin-top:1px}
.sendbtns{display:flex;gap:5px;justify-content:flex-end}
.sbtn{border:1px solid var(--line);background:transparent;border-radius:5px;
  padding:5px 10px;font-size:11px;cursor:pointer;color:var(--text-2);white-space:nowrap}
.sbtn:hover:not(:disabled){border-color:var(--accent-line);color:var(--accent-hi);background:var(--accent-soft)}
.sbtn.full{border-color:var(--accent);color:var(--accent-hi);font-weight:600}
.sbtn.full:hover:not(:disabled){background:var(--accent);color:#fff}
.sbtn:disabled{opacity:.45;cursor:not-allowed}
.sbtn.danger:hover{border-color:var(--danger);color:var(--danger);background:var(--danger-soft)}
/* 정품 구매 신청 */
.purbox{margin-top:7px;padding:9px 11px;border-radius:7px;
  border:1px solid var(--line);background:var(--bg-2)}
.purbox.on{border-color:color-mix(in srgb,var(--danger) 45%,transparent);
  background:var(--danger-soft)}
.purhead{font-size:11.5px;font-weight:700;color:var(--danger);
  display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.purhead.done{color:var(--text-3);font-weight:600}
.purpc{font-family:var(--mono);font-size:10.5px;font-weight:600;
  color:var(--danger);opacity:.85}
.purmeta{font-size:10.5px;color:var(--text-3);margin-top:2px}
.purnote{font-size:10.5px;color:var(--text-3);margin-top:6px}
.biztbl{margin-top:7px;border-collapse:collapse;width:100%}
.biztbl th{text-align:left;width:96px;padding:2px 0;font-size:10.5px;
  font-weight:600;color:var(--text-3);white-space:nowrap;vertical-align:top}
.biztbl td{padding:2px 0;font-size:11px;color:var(--text-2);word-break:break-all}

.licrow{display:flex;flex-direction:column;gap:6px}
.licline{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.mailwarn{margin:0 0 12px;padding:10px 12px;border-radius:7px;font-size:12px;
  background:var(--warn-soft);color:var(--warn);
  border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);display:none}
.mailwarn.on{display:block}
td.wrap{white-space:normal}

/* 공지 관리 */
.nform{display:flex;flex-direction:column;gap:8px;margin-bottom:14px;
  padding-bottom:14px;border-bottom:1px solid var(--line-soft)}
.nform input[type=text],.nform textarea,.nform select{border:1px solid var(--line);
  background:var(--sunken);border-radius:7px;padding:8px 10px;font:inherit;
  font-size:12.5px;color:var(--text);outline:none;width:100%;resize:vertical}
.nform input:focus,.nform textarea:focus,.nform select:focus{border-color:var(--accent);background:var(--panel)}
.nrow{display:flex;align-items:center;gap:10px}
.nrow select{width:auto;min-width:96px}
.ncheck{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2);cursor:pointer}
.ncheck input{width:14px;height:14px;margin:0;cursor:pointer;accent-color:var(--accent)}
.ncta{width:auto;margin-left:auto;padding:8px 18px;font-size:12.5px}
.nitem{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--line-soft)}
.nitem:last-child{border-bottom:0}
.nitem.off{opacity:.45}
.nbody{flex:1;min-width:0}
.ntop{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.ntitle{font-size:12.5px;font-weight:600}
.ntext{font-size:11.5px;color:var(--text-3);margin-top:3px;white-space:pre-wrap;line-height:1.5}
.nacts{display:flex;gap:5px;flex:0 0 auto}
.nbtn{border:1px solid var(--line);background:transparent;border-radius:5px;padding:4px 9px;
  font-size:11px;cursor:pointer;color:var(--text-2)}
.nbtn:hover{border-color:var(--accent-line);color:var(--accent-hi)}
.nbtn.del:hover{border-color:var(--danger);color:var(--danger);background:var(--danger-soft)}

table{width:100%;border-collapse:collapse;font-size:11.5px}
th{text-align:left;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--text-3);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line-soft);white-space:nowrap}
td{padding:7px 10px;border-bottom:1px solid var(--line-soft);white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--sunken)}
td.num{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
td.mono{font-family:var(--mono);font-size:10.5px}
.pill{display:inline-block;font-size:10px;padding:1px 7px;border-radius:99px;font-weight:600}
.pill.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.pill.err{background:var(--danger-soft);color:var(--danger)}
.pill.web{background:var(--accent-soft);color:var(--accent-hi)}
.pill.cad{background:var(--warn-soft);color:var(--warn)}
.scroll{overflow-x:auto}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:800px){.two{grid-template-columns:1fr}}
.empty{padding:26px 16px;text-align:center;color:var(--text-3);font-size:12px}
</style>
</head>
<body>

<div class="gate" id="gate">
  <h2>사용 현황</h2>
  <p>관리자 암호를 입력하세요. <code>.env</code>의 <code>ADMIN_TOKEN</code> 값입니다.</p>
  <input type="password" id="token" placeholder="관리자 암호" autocomplete="current-password">
  <button class="cta" id="enter">열기</button>
  <div class="err" id="gateErr"></div>
</div>

<div class="wrap" id="wrap" style="display:none">
  <div class="head">
    <h1>사용 현황</h1>
    <span class="sub" id="range">최근 30일</span>
    <div class="right">
      <a class="ghost-btn" href="/" style="text-decoration:none">서비스로</a>
      <button class="ghost-btn" id="themeBtn">◐ 테마</button>
      <button class="ghost-btn" id="reload">새로고침</button>
      <button class="ghost-btn" id="logout">잠그기</button>
    </div>
  </div>

  <div class="cards" id="cards"></div>

  <div class="panelbox">
    <h2>판매 설정</h2>
    <div class="pad">
      <div class="setrow">
        <label for="setPrice">정품 금액 (원 · 부가세 포함)</label>
        <input type="text" id="setPrice" inputmode="numeric" placeholder="44000">
      </div>
      <div class="setrow">
        <label for="setBank">입금 계좌 (예금주까지 한 줄로)</label>
        <input type="text" id="setBank" placeholder="농협 301-0019-9326-91 (예금주 안세종)">
      </div>
      <div class="setrow" style="align-items:center">
        <button class="sbtn full" id="setSave" style="padding:8px 18px">저장</button>
        <span class="setmsg" id="setMsg"></span>
      </div>
      <p class="sethelp">저장하면 소개 페이지 · CAD 정품신청 창 · 데모 안내
        메일에 바로 반영됩니다. 이미 접수된 신청의 금액은 바뀌지 않습니다.</p>
    </div>
  </div>

  <div class="panelbox">
    <h2>사용 신청자 <span class="cnt" id="appCnt"></span></h2>
    <div class="pad" style="padding-bottom:0">
      <p class="mailwarn" id="mailWarn">메일 계정이 설정되지 않아 발송할 수 없습니다.
        <code>.env</code> 의 <code>SMTP_USER</code> / <code>SMTP_PASS</code> 를 확인하세요.</p>
    </div>
    <div class="scroll"><table id="tApp"></table></div>
  </div>

  <div class="panelbox">
    <h2>공지사항 <span class="cnt" id="noticeCnt"></span></h2>
    <div class="pad">
      <div class="nform">
        <input type="text" id="nTitle" placeholder="제목" maxlength="120">
        <textarea id="nBody" placeholder="내용 (줄바꿈 가능, 비워도 됩니다)" rows="3"></textarea>
        <div class="nrow">
          <select id="nKind">
            <option value="info">안내</option>
            <option value="warn">주의</option>
            <option value="event">소식</option>
          </select>
          <label class="ncheck"><input type="checkbox" id="nPopup" checked> 접속 시 팝업</label>
          <button class="cta ncta" id="nAdd">등록</button>
        </div>
      </div>
      <div id="nList"></div>
    </div>
  </div>

  <div class="panelbox">
    <h2>일자별 추출 <span class="cnt" id="chartNote"></span></h2>
    <div class="pad">
      <div class="chart" id="chart"></div>
      <div class="axis"><span id="axL"></span><span id="axR">오늘</span></div>
    </div>
  </div>

  <div class="two">
    <div class="panelbox">
      <h2>좌표계별</h2>
      <div class="scroll"><table id="tCrs"></table></div>
    </div>
    <div class="panelbox">
      <h2>접속 경로별</h2>
      <div class="scroll"><table id="tSrc"></table></div>
    </div>
  </div>

  <div class="two">
    <div class="panelbox">
      <h2>많이 쓴 곳 <span class="cnt">최근 30일</span></h2>
      <div class="scroll"><table id="tIp"></table></div>
    </div>
    <div class="panelbox">
      <h2>실패 원인</h2>
      <div class="scroll"><table id="tErr"></table></div>
    </div>
  </div>

  <div class="panelbox">
    <h2>최근 추출 <span class="cnt" id="recentNote"></span></h2>
    <div class="scroll"><table id="tRecent"></table></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let TOKEN = localStorage.getItem('ksAdminToken') || '';

const nf = n => (n ?? 0).toLocaleString('ko-KR');
const mb = b => b >= 1048576 ? (b / 1048576).toFixed(1) + ' MB'
  : b >= 1024 ? (b / 1024).toFixed(0) + ' KB' : (b ?? 0) + ' B';
const ago = ts => {
  const s = Date.now() / 1000 - ts;
  if (s < 60) return '방금';
  if (s < 3600) return Math.floor(s / 60) + '분 전';
  if (s < 86400) return Math.floor(s / 3600) + '시간 전';
  return Math.floor(s / 86400) + '일 전';
};
const dt = ts => new Date(ts * 1000).toLocaleString('ko-KR',
  { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });

async function load() {
  const r = await fetch('/api/usage?days=30', { headers: { 'X-Admin-Token': TOKEN } });
  if (r.status === 401) throw new Error('암호가 올바르지 않습니다.');
  if (r.status === 503) throw new Error((await r.json()).detail);
  if (!r.ok) throw new Error('불러오지 못했습니다 (HTTP ' + r.status + ')');
  return r.json();
}

function render(d) {
  const t = d.total || {};
  const fail = t.err || 0;
  const rate = t.n ? (fail / t.n * 100) : 0;

  $('cards').innerHTML = [
    ['오늘', nf(d.today), '건'],
    ['최근 7일', nf(d.week), '건'],
    ['전체', nf(t.n), `성공 ${nf(t.ok)} · 실패 ${nf(fail)}`],
    ['실패율', rate.toFixed(1) + '%', fail ? '원인은 아래 표 참고' : '없음', rate > 20],
    ['추출 필지', nf(t.parcels), '누적'],
    ['생성 용량', mb(t.bytes), '누적'],
    ['평균 소요', (t.avg_sec || 0).toFixed(1) + '초', '성공 건 기준'],
    ['이용자', nf(d.users_30d), '최근 30일 · IP 기준'],
  ].map(([k, v, n, warn]) =>
    `<div class="card${warn ? ' warn' : ''}"><div class="k">${k}</div>
     <div class="v">${v}</div><div class="n">${n}</div></div>`).join('');

  const max = Math.max(1, ...d.daily.map(x => x.n));
  $('chart').innerHTML = d.daily.map(x => {
    const h = x.n ? Math.max(3, x.n / max * 100) : 0;
    const eh = x.n ? (x.err / x.n * 100) : 0;
    const day = new Date((d.now - x.ago * 86400) * 1000)
      .toLocaleDateString('ko-KR', { month: 'numeric', day: 'numeric' });
    return `<div class="bar${x.n ? '' : ' zero'}" style="height:${h}%">
      ${x.err ? `<div class="e" style="height:${eh}%"></div>` : ''}
      <div class="tip">${day} · ${x.n}건${x.err ? ` (실패 ${x.err})` : ''}</div></div>`;
  }).join('');
  $('axL').textContent = new Date((d.now - 29 * 86400) * 1000)
    .toLocaleDateString('ko-KR', { month: 'numeric', day: 'numeric' });
  $('chartNote').textContent = `최대 ${max}건/일 · 붉은 부분은 실패`;

  const tbl = (el, cols, rows, cells) => {
    $(el).innerHTML = rows.length
      ? `<thead><tr>${cols.map(c => `<th>${c}</th>`).join('')}</tr></thead>
         <tbody>${rows.map(cells).join('')}</tbody>`
      : `<tbody><tr><td class="empty" colspan="${cols.length}">기록 없음</td></tr></tbody>`;
  };

  tbl('tCrs', ['좌표계', '건수'], d.by_crs,
    r => `<tr><td class="mono">EPSG:${r.crs ?? '?'}</td><td class="num">${nf(r.n)}</td></tr>`);

  tbl('tSrc', ['경로', '건수'], d.by_source, r => {
    const label = r.source === 'cad' ? 'AutoCAD 리습' : r.source === 'web' ? '웹 화면' : r.source;
    const cls = r.source === 'cad' ? 'cad' : 'web';
    return `<tr><td><span class="pill ${cls}">${label}</span></td><td class="num">${nf(r.n)}</td></tr>`;
  });

  tbl('tIp', ['접속지', '건수', '마지막'], d.top_ip,
    r => `<tr><td class="mono">${r.ip ?? '알 수 없음'}</td>
          <td class="num">${nf(r.n)}</td><td class="num">${ago(r.last)}</td></tr>`);

  tbl('tErr', ['원인', '건수'], d.errors,
    r => `<tr><td>${(r.error || '').slice(0, 70)}</td><td class="num">${nf(r.n)}</td></tr>`);

  $('recentNote').textContent = `${d.recent.length}건 · 다운로드 누적 ${nf(d.downloads)}회`;
  tbl('tRecent',
    ['시각', '결과', '경로', '위치', '면적', '필지', '용량', '소요', '접속지'],
    d.recent, r => `<tr>
      <td class="mono">${dt(r.created)}</td>
      <td>${r.state === 'done' ? '<span class="pill ok">완료</span>'
        : `<span class="pill err" title="${(r.error || '').replace(/"/g, '')}">실패</span>`}</td>
      <td><span class="pill ${r.source === 'cad' ? 'cad' : 'web'}">${r.source === 'cad' ? 'CAD' : '웹'}</span></td>
      <td class="mono">${(r.lat ?? 0).toFixed(4)}, ${(r.lon ?? 0).toFixed(4)}</td>
      <td class="num">${(r.area_km2 ?? 0).toFixed(3)} km²</td>
      <td class="num">${nf(r.parcels)}</td>
      <td class="num">${mb(r.size)}</td>
      <td class="num">${(r.elapsed ?? 0).toFixed(1)}s</td>
      <td class="mono">${r.ip ?? '—'}</td></tr>`);
}

async function api(path, opts = {}) {
  const r = await fetch(path, {
    ...opts,
    headers: { 'X-Admin-Token': TOKEN, 'Content-Type': 'application/json', ...(opts.headers || {}) },
  });
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || `HTTP ${r.status}`);
  return r.status === 204 ? null : r.json();
}

const NKIND = { info: '안내', warn: '주의', event: '소식' };
const ASTATUS = { new: ['신청', 'cad'], demo: ['데모', 'web'], paid: ['정품', 'ok'], blocked: ['차단', 'err'] };

function licBlock(l) {
  const badges = [
    `<span class="pill ${l.kind === 'full' ? 'ok' : 'cad'}">${l.kind === 'full' ? '정품' : '데모'}</span>`,
    l.revoked ? '<span class="pill err">중지</span>' : '',
    l.expired ? '<span class="pill err">만료</span>' : '',
  ].join('');
  const until = l.expires_at
    ? new Date(l.expires_at * 1000).toLocaleDateString('ko-KR') + '까지'
    : '기간 제한 없음';
  const tr = l.transfers || { count: 0 };
  const trTxt = tr.count ? ` · PC이전 ${tr.count}회` : '';
  const acts = [
    l.kind === 'demo' ? `<button class="sbtn" data-lic="upgrade" data-key="${l.key}">정품 전환</button>` : '',
    `<button class="sbtn" data-lic="reset-machine" data-key="${l.key}">PC 해제</button>`,
    `<button class="sbtn danger" data-lic="${l.revoked ? 'unrevoke' : 'revoke'}" data-key="${l.key}">${l.revoked ? '중지 해제' : '사용 중지'}</button>`,
  ].join('');
  return `<div>
    <div class="licline"><span class="lickey">${l.key}</span>${badges}</div>
    <div class="licmeta">${l.machine ? 'PC 등록됨' : 'PC 미등록'} · 사용 ${l.uses}회 · ${until}${trTxt}</div>
    ${purBlock(l)}
    <div class="licline" style="margin-top:3px">${acts}</div>
  </div>`;
}

// 정품 구매 신청. 입금자명이 곧 PC 번호라 그것으로 대조한다.
function purBlock(l) {
  const p = l.purchase;
  if (!p) return '';

  const head = p.status === 'pending'
    ? `<div class="purhead">정품신청중<span class="purpc">입금자명 ${esc(p.machine || '—')}</span></div>`
    : '<div class="purhead done">정품 처리 완료</div>';

  const rows = [];
  if (p.req_name || p.contact) {
    rows.push(['신청자', p.req_name], ['연락처', p.contact]);
  }
  if (p.want_invoice) {
    rows.push(['사업자등록번호', p.biz_no], ['상호', p.biz_name],
              ['주소', p.biz_addr], ['업종', p.biz_type]);
  }
  const biz = (rows.length
      ? `<table class="biztbl">${rows.map(([k, v]) =>
          `<tr><th>${k}</th><td>${esc(v || '—')}</td></tr>`).join('')}</table>`
      : '')
    + (p.want_invoice ? ''
      : '<div class="purnote">세금계산서를 요청하지 않았습니다.</div>');

  const inv = p.want_invoice
    ? (p.invoiced
        ? `<span class="pill ok">발급완료</span>
           <button class="sbtn" data-pur="uninvoiced" data-key="${l.key}">발급 취소</button>`
        : `<button class="sbtn full" data-pur="invoiced" data-key="${l.key}">세금계산서 발급완료</button>`)
    : '';

  return `<div class="purbox${p.status === 'pending' ? ' on' : ''}">
    ${head}
    <div class="purmeta">${(p.amount || 0).toLocaleString('ko-KR')}원 (부가세 포함)</div>
    ${biz}
    ${inv ? `<div class="licline" style="margin-top:8px">${inv}</div>` : ''}
  </div>`;
}

async function loadApplicants() {
  let d;
  try { d = await api('/api/admin/applicants'); } catch { return; }
  const list = d.applicants || [];
  $('appCnt').innerHTML = `${list.length}명 · 데모 ${list.filter(a => a.status === 'demo').length}` +
    ` · 정품 ${list.filter(a => a.status === 'paid').length}` +
    (d.pending_purchases ? ` · <b style="color:var(--danger)">정품신청중 ${d.pending_purchases}</b>` : '');
  $('mailWarn').classList.toggle('on', !d.mail_ready);
  if (!$('setPrice').dataset.dirty) $('setPrice').value = d.price ?? '';
  if (!$('setBank').dataset.dirty) $('setBank').value = d.bank ?? '';

  if (!list.length) {
    $('tApp').innerHTML = '<tbody><tr><td class="empty" colspan="5">아직 신청자가 없습니다.</td></tr></tbody>';
    return;
  }

  $('tApp').innerHTML = '<thead><tr><th>신청자</th><th>상태</th><th>발급키</th><th>신청일</th>' +
    '<th style="text-align:right">발송 · 관리</th></tr></thead><tbody>' +
    list.map(a => {
      const st = ASTATUS[a.status] || ['?', 'cad'];
      const lic = (a.licenses || []).slice().reverse();
      const who = [a.name, a.company].filter(Boolean).join(' · ') || '—';
      return `<tr>
        <td class="wrap">
          <div class="appmail">${esc(a.email)}</div>
          <div class="appwho">${esc(who)}</div>
          ${a.memo ? `<div class="appwho">${esc(a.memo)}</div>` : ''}
        </td>
        <td><span class="pill ${st[1]}">${st[0]}</span></td>
        <td class="wrap">${lic.length
          ? `<div class="licrow">${lic.map(licBlock).join('')}</div>`
          : '<span style="color:var(--text-3)">—</span>'}</td>
        <td class="num">${new Date(a.created * 1000)
          .toLocaleDateString('ko-KR', { month: '2-digit', day: '2-digit' })}</td>
        <td>
          <div class="sendbtns">
            <button class="sbtn" data-send="demo" data-email="${esc(a.email)}" data-name="${esc(a.name || '')}">데모 보내기</button>
            <button class="sbtn full" data-send="full" data-email="${esc(a.email)}" data-name="${esc(a.name || '')}">정품 보내기</button>
            <button class="sbtn danger" data-appdel="${a.id}">삭제</button>
          </div>
        </td>
      </tr>`;
    }).join('') + '</tbody>';

  $('tApp').querySelectorAll('[data-send]').forEach(b => b.onclick = async () => {
    const kind = b.dataset.send;
    const label = kind === 'full' ? '정품' : '데모';
    if (!confirm(b.dataset.email + ' 로 ' + label + ' 발급키와 사용법을 보낼까요?')) return;
    const orig = b.textContent;
    b.disabled = true; b.textContent = '보내는 중…';
    try {
      const r = await api('/api/admin/send', {
        method: 'POST',
        body: JSON.stringify({ email: b.dataset.email, name: b.dataset.name, kind }),
      });
      alert(label + ' 발송 완료\n발급키 ' + r.key +
        (r.attached ? '\n설치 파일도 첨부했습니다.' : '\n(설치 파일이 없어 본문만 보냈습니다)'));
      loadApplicants();
    } catch (e) {
      alert('발송 실패: ' + e.message);
    } finally { b.disabled = false; b.textContent = orig; }
  });

  $('tApp').querySelectorAll('[data-lic]').forEach(b => b.onclick = async () => {
    const act = b.dataset.lic;
    const ko = { upgrade: '정품으로 전환', 'reset-machine': 'PC 묶임을 해제',
                 revoke: '사용을 중지', unrevoke: '중지를 해제' }[act];
    if (!confirm(b.dataset.key + ' 를 ' + ko + '할까요?')) return;
    try {
      await api('/api/admin/license/' + b.dataset.key + '/' + act, { method: 'POST' });
      loadApplicants();
    } catch (e) { alert(e.message); }
  });

  ['setPrice', 'setBank'].forEach(i =>
    $(i).addEventListener('input', () => { $(i).dataset.dirty = '1'; }));
  $('setSave').onclick = async () => {
    const msg = $('setMsg');
    msg.className = 'setmsg'; msg.textContent = '저장하는 중…';
    try {
      const r = await api('/api/admin/settings', {
        method: 'POST',
        body: JSON.stringify({ price: $('setPrice').value, bank: $('setBank').value }),
      });
      delete $('setPrice').dataset.dirty; delete $('setBank').dataset.dirty;
      $('setPrice').value = r.price; $('setBank').value = r.bank;
      msg.textContent = '저장했습니다.';
      setTimeout(() => { msg.textContent = ''; }, 2500);
    } catch (e) {
      msg.className = 'setmsg err';
      msg.textContent = e.message;
    }
  };

  $('tApp').querySelectorAll('[data-pur]').forEach(b => b.onclick = async () => {
    const on = b.dataset.pur === 'invoiced';
    if (!confirm(on ? '세금계산서를 발급한 것으로 표시할까요?'
                    : '발급완료 표시를 지울까요?')) return;
    try {
      await api('/api/admin/purchase/' + b.dataset.key + '/' + b.dataset.pur,
                { method: 'POST' });
      loadApplicants();
    } catch (e) { alert(e.message); }
  });

  $('tApp').querySelectorAll('[data-appdel]').forEach(b => b.onclick = async () => {
    if (!confirm('이 신청자를 목록에서 지울까요? 발급한 키는 그대로 남습니다.')) return;
    await api('/api/admin/applicants/' + b.dataset.appdel, { method: 'DELETE' });
    loadApplicants();
  });
}

async function loadNotices() {
  let list = [];
  try { list = (await api('/api/admin/notices')).notices || []; }
  catch { return; }
  const live = list.filter(n => n.active).length;
  $('noticeCnt').textContent = `${list.length}건 · 노출 중 ${live}건`;
  $('nList').innerHTML = list.length ? list.map(n => `
    <div class="nitem${n.active ? '' : ' off'}">
      <div class="nbody">
        <div class="ntop">
          <span class="pill ${n.kind === 'warn' ? 'err' : n.kind === 'event' ? 'web' : 'cad'}">${NKIND[n.kind] || n.kind}</span>
          <span class="ntitle">${esc(n.title)}</span>
          ${n.popup ? '<span class="pill web">팝업</span>' : ''}
          ${n.active ? '' : '<span class="pill err">숨김</span>'}
        </div>
        ${n.body ? `<div class="ntext">${esc(n.body)}</div>` : ''}
      </div>
      <div class="nacts">
        <button class="nbtn" data-toggle="${n.id}" data-on="${n.active ? 1 : 0}">${n.active ? '숨기기' : '노출'}</button>
        <button class="nbtn del" data-del="${n.id}">삭제</button>
      </div>
    </div>`).join('') : '<div class="empty">등록된 공지가 없습니다.</div>';

  $('nList').querySelectorAll('[data-toggle]').forEach(b => b.onclick = async () => {
    await api(`/api/admin/notices/${b.dataset.toggle}`, {
      method: 'PATCH', body: JSON.stringify({ active: b.dataset.on !== '1' }) });
    loadNotices();
  });
  $('nList').querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
    if (!confirm('이 공지를 삭제할까요?')) return;
    await api(`/api/admin/notices/${b.dataset.del}`, { method: 'DELETE' });
    loadNotices();
  });
}

function esc(s) {
  return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

$('nAdd').onclick = async () => {
  const title = $('nTitle').value.trim();
  if (!title) { $('nTitle').focus(); return; }
  try {
    await api('/api/admin/notices', { method: 'POST', body: JSON.stringify({
      title, body: $('nBody').value, kind: $('nKind').value, popup: $('nPopup').checked }) });
    $('nTitle').value = ''; $('nBody').value = '';
    loadNotices();
  } catch (e) { alert(e.message); }
};

async function open_() {
  try {
    const d = await load();
    $('gate').style.display = 'none';
    $('wrap').style.display = '';
    localStorage.setItem('ksAdminToken', TOKEN);
    render(d);
    loadNotices();
    loadApplicants();
  } catch (e) {
    $('gate').style.display = '';
    $('wrap').style.display = 'none';
    $('gateErr').style.display = '';
    $('gateErr').textContent = e.message;
  }
}

$('enter').onclick = () => { TOKEN = $('token').value.trim(); open_(); };
$('token').addEventListener('keydown', e => { if (e.key === 'Enter') $('enter').click(); });
$('reload').onclick = open_;
$('logout').onclick = () => {
  localStorage.removeItem('ksAdminToken'); TOKEN = '';
  $('wrap').style.display = 'none'; $('gate').style.display = '';
  $('token').value = ''; $('gateErr').style.display = 'none';
};
$('themeBtn').onclick = () => {
  const cur = document.documentElement.getAttribute('data-theme')
    || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', cur === 'dark' ? 'light' : 'dark');
};

if (TOKEN) open_(); else $('token').focus();
</script>
</body>
</html>
