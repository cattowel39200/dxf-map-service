# Render 배포 설계도. dashboard.render.com → New → Blueprint 에서 저장소를 고르면
# 이 파일대로 만들어진다.
#
# starter 는 월 $7, CPU 0.5 / RAM 512 MB 이고 잠들지 않는다.
# 실측 최대 사용량이 114 MB(1,304필지 추출 시)라 512 MB로 충분하다.
# 무료로 먼저 시험하려면 plan 을 free 로 바꾼다. 대신 15분 미사용 시 잠들어
# 첫 접속에 1분쯤 걸린다.
services:
  - type: web
    name: dxf-map-service
    runtime: docker
    plan: starter
    region: singapore          # 한국에서 가장 가깝다
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/config
    envVars:
      # 값은 Render 대시보드에서 직접 넣는다. 저장소에 두지 않는다.
      - key: VWORLD_KEY
        sync: false
      # V-World 인증키에 등록한 도메인. 앞에서부터 시도하고 거부되면 다음으로
      # 넘어가므로, 커스텀 도메인을 붙이기 전에도 배포판이 동작한다.
      - key: VWORLD_DOMAIN
        value: ks-down-map.com,localhost
      - key: MAX_AREA_KM2
        value: "1.0"
      - key: MAX_CONCURRENT_JOBS
        value: "2"
      - key: OUTPUT_TTL_HOURS
        value: "6"
